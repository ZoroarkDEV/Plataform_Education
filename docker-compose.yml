# Ambiente local do DevPath: aplicação (web), PostgreSQL (dados) e Redis (cache/sessões).
# Uso: cp .env.example .env && docker compose up --build
# Só a infraestrutura (para rodar a app com `dotnet run`): docker compose up -d postgres redis
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env (veja .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env (veja .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:?defina POSTGRES_USER no .env (veja .env.example)} -d $${POSTGRES_DB:?defina POSTGRES_DB no .env (veja .env.example)}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devpath-web:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Development: aplica as migrations e faz o seed de /content no startup (issue #21).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      # Dentro da rede do compose o banco é o serviço "postgres" na porta 5432 (não a porta publicada).
      ConnectionStrings__DevPath: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?defina POSTGRES_DB no .env (veja .env.example)};Username=${POSTGRES_USER:?defina POSTGRES_USER no .env (veja .env.example)};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}"
      Content__RootPath: /app/content
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # Chaves do Data Protection (cookies de login/antiforgery) sobrevivem a recriar o container.
      - web_keys:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      # A imagem aspnet não tem curl/wget: faz o GET /health com o /dev/tcp do bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  web_keys:
