# Trilha SQL & Dados: metadados lidos pelo ContentSeeder.
# O nome da pasta é o slug da trilha (fixo: é por ele que o seed acha a trilha no banco; o título pode mudar).
title: "SQL & Dados"
description: "Aprenda a consultar e organizar dados do zero, direto no navegador, sem instalar nada. Depois você monta o ambiente no seu computador e aprofunda."
icon: database
difficulty_level: beginner
# Estimativa inicial; ajuste quando as aulas estiverem prontas.
estimated_hours: 40
order: 2

# Ordem dos módulos na trilha. Cada slug tem uma pasta em modules/<slug>/ com as aulas.
modules:
  # Primeiro contato com SQL no navegador (issue #22), antes do módulo de ambiente/Docker.
  - slug: primeiros-passos-com-sql
    title: "Primeiros passos com SQL"
    description: "Primeiro contato com SQL direto no navegador, sem instalar nada: SELECT, WHERE, ORDER BY, LIMIT, JOIN e agregações sobre o banco de exemplo de uma livraria."
    completion_subtitle: "Você fez um banco de dados de verdade responder às suas perguntas, direto no navegador."
    order: 1
  # Segundo módulo no navegador (issue #41): LIKE, IN/BETWEEN, DISTINCT, HAVING e LEFT JOIN.
  - slug: mais-consultas-com-sql
    title: "Mais consultas com SQL"
    description: "Continue no navegador, sem instalar nada: busque por parte do texto, filtre por listas e faixas, tire repetições, filtre grupos e descubra quem ficou sem par."
    completion_subtitle: "Agora você busca, filtra e cruza dados como quem trabalha com isso no dia a dia."
    order: 2
  - slug: ambiente
    title: "Ambiente: banco relacional + Docker"
    description: "O que é um banco relacional e como montar o ambiente local com Docker, docker-compose e um cliente SQL."
    order: 3
  - slug: estruturas
    title: "Criando estruturas"
    description: "CREATE DATABASE, CREATE TABLE e constraints."
    order: 4
  - slug: crud
    title: "CRUD completo"
    description: "INSERT, SELECT, UPDATE e DELETE."
    order: 5
  - slug: consultas
    title: "Consultas"
    description: "JOINs, agregações e consultas mais elaboradas com subqueries e CTEs."
    order: 6
  - slug: performance-e-confiabilidade
    title: "Performance e confiabilidade"
    description: "Índices e performance básica, transactions e ACID, backup e restore."
    order: 7
  - slug: conectando-csharp
    title: "Conectando C# ao banco"
    description: "Acesso ao PostgreSQL a partir do C# com ADO.NET e Entity Framework Core."
    order: 8
